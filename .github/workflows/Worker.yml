name: Build All DOS, 9x (incl. ME), NT & Modern Targets

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-all-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare output directory
        run: mkdir -p dist

      - name: Install MinGW-w64 (32-bit i686 & 64-bit x86_64) & build tools
        id: setup_mingw
        continue-on-error: true
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-i686 gcc-mingw-w64-x86_64 mingw-w64-tools
          i686-w64-mingw32-gcc --version
          x86_64-w64-mingw32-gcc --version

      # ======================================================================
      # 1. MS-DOS / FreeDOS & 2. Win16 (Open Watcom varsa derle; yoksa atla)
      # ======================================================================
      - name: 1. Build MS-DOS / FreeDOS (Open Watcom)
        id: build_dos
        continue-on-error: true
        run: |
          if command -v wcl >/dev/null 2>&1; then
            wcl -bt=dos -mm -1 bgc.c -fe=dist/bgc_dos.exe -dBGC_VAULT_KEY=0x13572468u
          else
            echo "Open Watcom (wcl) bulunamadi; DOS/FreeDOS ikilisi yerel Open Watcom veya ozel job ile alinabilir."
            exit 1
          fi

      - name: 2. Build Win16 (Open Watcom)
        id: build_win16
        continue-on-error: true
        run: |
          if command -v wcl >/dev/null 2>&1; then
            wcl -bt=windows -ml -1 bgc.c -fe=dist/bgc_win16.exe -dBGC_VAULT_KEY=0x13572468u
          else
            echo "Open Watcom (wcl) bulunamadi; Win16 ikilisi yerel Open Watcom veya ozel job ile alinabilir."
            exit 1
          fi

      # ======================================================================
      # 3. Tum Windows 9x Surumleri (Win95, Win98, Windows ME dahil)
      # ======================================================================
      - name: 3a. Build Windows 95 (9x)
        id: build_win95
        continue-on-error: true
        run: |
          i686-w64-mingw32-gcc -O2 -DWINVER=0x0400 -D_WIN32_WINDOWS=0x0400 bgc.c -o dist/bgc_win95.exe -lgdi32 -lwinmm -DBGC_VAULT_KEY=0x13572468u

      - name: 3b. Build Windows 98 (9x)
        id: build_win98
        continue-on-error: true
        run: |
          i686-w64-mingw32-gcc -O2 -DWINVER=0x0410 -D_WIN32_WINDOWS=0x0410 bgc.c -o dist/bgc_win98.exe -lgdi32 -lwinmm -DBGC_VAULT_KEY=0x13572468u

      - name: 3c. Build Windows ME (9x)
        id: build_winme
        continue-on-error: true
        run: |
          i686-w64-mingw32-gcc -O2 -DWINVER=0x0490 -D_WIN32_WINDOWS=0x0490 bgc.c -o dist/bgc_winme.exe -lgdi32 -lwinmm -DBGC_VAULT_KEY=0x13572468u

      # ======================================================================
      # 4. Tum Windows NT Surumleri (NT 3.1 .. Windows 11; XP32 -> XP64 sirali)
      # ======================================================================
      - name: 4a. Build Windows NT 3.1
        id: build_nt31
        continue-on-error: true
        run: |
          i686-w64-mingw32-gcc -O2 -DWINVER=0x030A -D_WIN32_WINNT=0x030A bgc.c -o dist/bgc_nt31.exe -lgdi32 -lwinmm -DBGC_VAULT_KEY=0x13572468u

      - name: 4b. Build Windows NT 3.5
        id: build_nt35
        continue-on-error: true
        run: |
          i686-w64-mingw32-gcc -O2 -DWINVER=0x0332 -D_WIN32_WINNT=0x0332 bgc.c -o dist/bgc_nt35.exe -lgdi32 -lwinmm -DBGC_VAULT_KEY=0x13572468u

      - name: 4c. Build Windows NT 3.51
        id: build_nt351
        continue-on-error: true
        run: |
          i686-w64-mingw32-gcc -O2 -DWINVER=0x0333 -D_WIN32_WINNT=0x0333 bgc.c -o dist/bgc_nt351.exe -lgdi32 -lwinmm -DBGC_VAULT_KEY=0x13572468u

      - name: 4d. Build Windows NT 4.0
        id: build_nt40
        continue-on-error: true
        run: |
          i686-w64-mingw32-gcc -O2 -DWINVER=0x0400 -D_WIN32_WINNT=0x0400 bgc.c -o dist/bgc_nt40.exe -lgdi32 -lwinmm -lws2_32 -DBGC_VAULT_KEY=0x13572468u

      - name: 4e. Build Windows 2000 (NT 5.0)
        id: build_win2000
        continue-on-error: true
        run: |
          i686-w64-mingw32-gcc -O2 -DWINVER=0x0500 -D_WIN32_WINNT=0x0500 bgc.c -o dist/bgc_win2000.exe -lgdi32 -lwinmm -lws2_32 -DBGC_VAULT_KEY=0x13572468u

      - name: 4f. Build Windows XP 32-bit (XP32 - NT 5.1)
        id: build_xp32
        continue-on-error: true
        run: |
          i686-w64-mingw32-gcc -O2 -DWINVER=0x0501 -D_WIN32_WINNT=0x0501 bgc.c -o dist/bgc_xp32.exe -lgdi32 -lwinmm -lws2_32 -DBGC_VAULT_KEY=0x13572468u

      - name: 4g. Build Windows XP 64-bit (XP64 - NT 5.2)
        id: build_xp64
        continue-on-error: true
        run: |
          x86_64-w64-mingw32-gcc -O2 -DWINVER=0x0502 -D_WIN32_WINNT=0x0502 bgc.c -o dist/bgc_xp64.exe -lgdi32 -lwinmm -lws2_32 -DBGC_VAULT_KEY=0x13572468u

      - name: 4h. Build Windows Vista (NT 6.0)
        id: build_vista
        continue-on-error: true
        run: |
          x86_64-w64-mingw32-gcc -O2 -DWINVER=0x0600 -D_WIN32_WINNT=0x0600 bgc.c -o dist/bgc_vista.exe -lgdi32 -lwinmm -lws2_32 -DBGC_VAULT_KEY=0x13572468u

      - name: 4i. Build Windows 7 (NT 6.1)
        id: build_win7
        continue-on-error: true
        run: |
          x86_64-w64-mingw32-gcc -O2 -DWINVER=0x0601 -D_WIN32_WINNT=0x0601 bgc.c -o dist/bgc_win7.exe -lgdi32 -lwinmm -lws2_32 -DBGC_VAULT_KEY=0x13572468u

      - name: 4j. Build Windows 8 / 8.1 (NT 6.2 / 6.3)
        id: build_win8
        continue-on-error: true
        run: |
          x86_64-w64-mingw32-gcc -O2 -DWINVER=0x0603 -D_WIN32_WINNT=0x0603 bgc.c -o dist/bgc_win8.exe -lgdi32 -lwinmm -lws2_32 -DBGC_VAULT_KEY=0x13572468u

      - name: 4k. Build Windows 10 / 11 (NT 10.0 - x86 & x64)
        id: build_win10_11
        continue-on-error: true
        run: |
          i686-w64-mingw32-gcc -O2 -DWINVER=0x0A00 -D_WIN32_WINNT=0x0A00 bgc.c -o dist/bgc_win10_11_x86.exe -lgdi32 -lwinmm -lws2_32 -DBGC_VAULT_KEY=0x13572468u && \
          x86_64-w64-mingw32-gcc -O2 -DWINVER=0x0A00 -D_WIN32_WINNT=0x0A00 bgc.c -o dist/bgc_win10_11_x64.exe -lgdi32 -lwinmm -lws2_32 -DBGC_VAULT_KEY=0x13572468u

      - name: Upload all successful build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bgc-all-targets
          path: dist/*
          if-no-files-found: ignore

      - name: Check overall build status
        if: always()
        run: |
          ANY_FAIL=0
          for status in \
            "${{ steps.build_dos.outcome }}" \
            "${{ steps.build_win16.outcome }}" \
            "${{ steps.build_win95.outcome }}" \
            "${{ steps.build_win98.outcome }}" \
            "${{ steps.build_winme.outcome }}" \
            "${{ steps.build_nt31.outcome }}" \
            "${{ steps.build_nt35.outcome }}" \
            "${{ steps.build_nt351.outcome }}" \
            "${{ steps.build_nt40.outcome }}" \
            "${{ steps.build_win2000.outcome }}" \
            "${{ steps.build_xp32.outcome }}" \
            "${{ steps.build_xp64.outcome }}" \
            "${{ steps.build_vista.outcome }}" \
            "${{ steps.build_win7.outcome }}" \
            "${{ steps.build_win8.outcome }}" \
            "${{ steps.build_win10_11.outcome }}"
          do
            if [ "$status" != "success" ]; then
              ANY_FAIL=1
            fi
          done
          if [ "$ANY_FAIL" -eq 1 ]; then
            echo "Bazi hedeflerde hata cikti; onceki basarili derlemeler bgc-all-targets artifact'ina yuklendi."
            exit 1
          fi
