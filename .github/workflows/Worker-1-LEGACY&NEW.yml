name: Build DOS (DJGPP) and 9x + All NT (Visual Studio)

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build-dos-djgpp:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare dist directory
        run: mkdir -p dist

      - name: Install DJGPP toolchain from official GitHub releases
        run: |
          sudo apt-get update
          sudo apt-get install -y curl tar xz-utils p7zip-full
          mkdir -p /opt/djgpp
          RELEASE_URL=$(curl -fsSL https://api.github.com/repos/andrewwutwut/build-djgpp/releases/latest \
            | grep -Eo 'https://[^"]*(linux|x86_64)[^"]*\.(tar\.(gz|bz2|xz)|7z|zip)' \
            | head -n 1)
          echo "Resolved DJGPP URL: ${RELEASE_URL}"
          if [ -z "${RELEASE_URL}" ]; then
            echo "Could not resolve DJGPP release archive from andrewwutwut/build-djgpp"
            exit 1
          fi
          curl -fSL --retry 3 "${RELEASE_URL}" -o /tmp/djgpp_pkg
          case "${RELEASE_URL}" in
            *.7z) 7z x /tmp/djgpp_pkg -o/opt/djgpp -y >/dev/null ;;
            *.zip) unzip -q /tmp/djgpp_pkg -d /opt/djgpp ;;
            *) tar -xf /tmp/djgpp_pkg -C /opt/djgpp ;;
          esac
          DJGPP_BIN_DIR=$(find /opt/djgpp -maxdepth 4 -type f -name '*djgpp*-gcc' -printf '%h\n' | head -n 1)
          if [ -z "${DJGPP_BIN_DIR}" ]; then
            DJGPP_BIN_DIR=$(find /opt/djgpp -maxdepth 4 -type f -name 'i586-pc-msdosdjgpp-gcc' -printf '%h\n' | head -n 1)
          fi
          echo "DJGPP_BIN_DIR=${DJGPP_BIN_DIR}"
          if [ -z "${DJGPP_BIN_DIR}" ]; then
            ls -la /opt/djgpp
            exit 1
          fi
          echo "${DJGPP_BIN_DIR}" >> "$GITHUB_PATH"
          DJGPP_CC=$(find "${DJGPP_BIN_DIR}" -maxdepth 1 -type f -name '*-gcc' | head -n 1)
          echo "DJGPP_CC=${DJGPP_CC}" >> "$GITHUB_ENV"

      - name: Build DOS / FreeDOS (bgc_freedos.exe)
        run: |
          echo "Using compiler: ${DJGPP_CC}"
          "${DJGPP_CC}" -O2 -D_CRT_SECURE_NO_WARNINGS -DBGC_VAULT_KEY=0x13572468u bgc.c -o dist/bgc_freedos.exe
          ls -lh dist/bgc_freedos.exe

      - name: Upload DOS / FreeDOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: dos-freedos-djgpp
          path: dist/*

  build-9x-and-nt-vs:
    runs-on: windows-latest
    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare dist directory
        run: if not exist dist mkdir dist

      - name: Build Windows 9x (95 / 98 / ME) with VS
        run: |
          set "VSDIR="
          for /f "tokens=*" %%I in ('"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath') do set "VSDIR=%%I"
          if not defined VSDIR (
            echo Visual Studio C++ tools not found via vswhere.
            exit /b 1
          )
          call "%VSDIR%\Common7\Tools\VsDevCmd.bat" -arch=x86 -host_arch=x64
          echo Active WindowsSDKVersion=%WindowsSDKVersion%
          cl /nologo /O2 /W3 /D_CRT_SECURE_NO_WARNINGS /FIwinsock2.h /DWINVER=0x0400 /D_WIN32_WINDOWS=0x0400 /DBGC_VAULT_KEY=0x13572468u bgc.c /Fe:dist\bgc_win95_98.exe /link gdi32.lib winmm.lib user32.lib ws2_32.lib
          if errorlevel 1 exit /b 1
          cl /nologo /O2 /W3 /D_CRT_SECURE_NO_WARNINGS /FIwinsock2.h /DWINVER=0x0490 /D_WIN32_WINDOWS=0x0490 /DBGC_VAULT_KEY=0x13572468u bgc.c /Fe:dist\bgc_winme.exe /link gdi32.lib winmm.lib user32.lib ws2_32.lib
          if errorlevel 1 exit /b 1

      - name: Build All NT-Based Targets with VS
        run: |
          set "VSDIR="
          for /f "tokens=*" %%I in ('"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath') do set "VSDIR=%%I"
          if not defined VSDIR (
            echo Visual Studio C++ tools not found via vswhere.
            exit /b 1
          )
          call "%VSDIR%\Common7\Tools\VsDevCmd.bat" -arch=x86 -host_arch=x64
          echo Active WindowsSDKVersion=%WindowsSDKVersion%
          cl /nologo /O2 /W3 /D_CRT_SECURE_NO_WARNINGS /FIwinsock2.h /DWINVER=0x0400 /D_WIN32_WINNT=0x0400 /DBGC_VAULT_KEY=0x13572468u bgc.c /Fe:dist\bgc_nt40_x86.exe /link gdi32.lib winmm.lib user32.lib ws2_32.lib
          if errorlevel 1 exit /b 1
          cl /nologo /O2 /W3 /D_CRT_SECURE_NO_WARNINGS /FIwinsock2.h /DWINVER=0x0500 /D_WIN32_WINNT=0x0500 /DBGC_VAULT_KEY=0x13572468u bgc.c /Fe:dist\bgc_win2000_x86.exe /link gdi32.lib winmm.lib user32.lib ws2_32.lib
          if errorlevel 1 exit /b 1
          cl /nologo /O2 /W3 /D_CRT_SECURE_NO_WARNINGS /FIwinsock2.h /DWINVER=0x0501 /D_WIN32_WINNT=0x0501 /DBGC_VAULT_KEY=0x13572468u bgc.c /Fe:dist\bgc_xp_x86.exe /link gdi32.lib winmm.lib user32.lib ws2_32.lib
          if errorlevel 1 exit /b 1
          cl /nologo /O2 /W3 /D_CRT_SECURE_NO_WARNINGS /FIwinsock2.h /DWINVER=0x0600 /D_WIN32_WINNT=0x0600 /DBGC_VAULT_KEY=0x13572468u bgc.c /Fe:dist\bgc_vista_x86.exe /link gdi32.lib winmm.lib user32.lib ws2_32.lib
          if errorlevel 1 exit /b 1
          cl /nologo /O2 /W3 /D_CRT_SECURE_NO_WARNINGS /FIwinsock2.h /DWINVER=0x0601 /D_WIN32_WINNT=0x0601 /DBGC_VAULT_KEY=0x13572468u bgc.c /Fe:dist\bgc_win7_x86.exe /link gdi32.lib winmm.lib user32.lib ws2_32.lib
          if errorlevel 1 exit /b 1
          cl /nologo /O2 /W3 /D_CRT_SECURE_NO_WARNINGS /FIwinsock2.h /DWINVER=0x0602 /D_WIN32_WINNT=0x0602 /DBGC_VAULT_KEY=0x13572468u bgc.c /Fe:dist\bgc_win8_x86.exe /link gdi32.lib winmm.lib user32.lib ws2_32.lib
          if errorlevel 1 exit /b 1
          cl /nologo /O2 /W3 /D_CRT_SECURE_NO_WARNINGS /FIwinsock2.h /DWINVER=0x0603 /D_WIN32_WINNT=0x0603 /DBGC_VAULT_KEY=0x13572468u bgc.c /Fe:dist\bgc_win81_x86.exe /link gdi32.lib winmm.lib user32.lib ws2_32.lib
          if errorlevel 1 exit /b 1
          cl /nologo /O2 /W3 /D_CRT_SECURE_NO_WARNINGS /FIwinsock2.h /DWINVER=0x0A00 /D_WIN32_WINNT=0x0A00 /DBGC_VAULT_KEY=0x13572468u bgc.c /Fe:dist\bgc_win10_11_x86.exe /link gdi32.lib winmm.lib user32.lib ws2_32.lib
          if errorlevel 1 exit /b 1

          call "%VSDIR%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          cl /nologo /O2 /W3 /D_CRT_SECURE_NO_WARNINGS /FIwinsock2.h /DWINVER=0x0502 /D_WIN32_WINNT=0x0502 /DBGC_VAULT_KEY=0x13572468u bgc.c /Fe:dist\bgc_xp_2003_x64.exe /link gdi32.lib winmm.lib user32.lib ws2_32.lib
          if errorlevel 1 exit /b 1
          cl /nologo /O2 /W3 /D_CRT_SECURE_NO_WARNINGS /FIwinsock2.h /DWINVER=0x0600 /D_WIN32_WINNT=0x0600 /DBGC_VAULT_KEY=0x13572468u bgc.c /Fe:dist\bgc_vista_x64.exe /link gdi32.lib winmm.lib user32.lib ws2_32.lib
          if errorlevel 1 exit /b 1
          cl /nologo /O2 /W3 /D_CRT_SECURE_NO_WARNINGS /FIwinsock2.h /DWINVER=0x0601 /D_WIN32_WINNT=0x0601 /DBGC_VAULT_KEY=0x13572468u bgc.c /Fe:dist\bgc_win7_x64.exe /link gdi32.lib winmm.lib user32.lib ws2_32.lib
          if errorlevel 1 exit /b 1
          cl /nologo /O2 /W3 /D_CRT_SECURE_NO_WARNINGS /FIwinsock2.h /DWINVER=0x0602 /D_WIN32_WINNT=0x0602 /DBGC_VAULT_KEY=0x13572468u bgc.c /Fe:dist\bgc_win8_x64.exe /link gdi32.lib winmm.lib user32.lib ws2_32.lib
          if errorlevel 1 exit /b 1
          cl /nologo /O2 /W3 /D_CRT_SECURE_NO_WARNINGS /FIwinsock2.h /DWINVER=0x0603 /D_WIN32_WINNT=0x0603 /DBGC_VAULT_KEY=0x13572468u bgc.c /Fe:dist\bgc_win81_x64.exe /link gdi32.lib winmm.lib user32.lib ws2_32.lib
          if errorlevel 1 exit /b 1
          cl /nologo /O2 /W3 /D_CRT_SECURE_NO_WARNINGS /FIwinsock2.h /DWINVER=0x0A00 /D_WIN32_WINNT=0x0A00 /DBGC_VAULT_KEY=0x13572468u bgc.c /Fe:dist\bgc_win10_11_x64.exe /link gdi32.lib winmm.lib user32.lib ws2_32.lib
          if errorlevel 1 exit /b 1
          dir dist\*.exe

      - name: Upload Windows 9x and NT VS artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-9x-nt-vs
          path: dist/*
