name: Build Retro (FreeDOS, Win16, 9x, NT & XP32)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  retro-to-xp32:
    runs-on: windows-latest
    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare dist directory
        run: if not exist dist mkdir dist

      - name: Install Open Watcom v2 (x64)
        id: ow_setup
        continue-on-error: true
        run: |
          if not exist "%TEMP%\ow_installer" mkdir "%TEMP%\ow_installer"
          curl.exe -fSL --retry 3 "https://github.com/open-watcom/open-watcom-v2/releases/download/Current-build/open-watcom-2_0-c-win-x64.exe" -o "%TEMP%\ow_installer\open-watcom-2_0-c-win-x64.exe"
          "%TEMP%\ow_installer\open-watcom-2_0-c-win-x64.exe" /S
          set "WATCOM="
          for %%D in ("C:\WATCOM" "C:\OW" "C:\openwatcom" "C:\Program Files\OpenWatcom" "C:\Program Files (x86)\OpenWatcom") do (
            if exist "%%~fD\BINNT64\wcl386.exe" set "WATCOM=%%~fD"
            if not defined WATCOM if exist "%%~fD\BINNT\wcl.exe" set "WATCOM=%%~fD"
          )
          if not defined WATCOM (
            for /d %%D in ("C:\*WATCOM*" "C:\*watcom*") do (
              if exist "%%~fD\BINNT64" set "WATCOM=%%~fD"
              if not defined WATCOM if exist "%%~fD\BINNT" set "WATCOM=%%~fD"
            )
          )
          if defined WATCOM (
            echo Detected WATCOM=%WATCOM%
            echo WATCOM=%WATCOM%>> "%GITHUB_ENV%"
            echo LIB=%WATCOM%\LIB386\DOS;%WATCOM%\LIB386;%WATCOM%\LIB386\NT>> "%GITHUB_ENV%"
            echo %WATCOM%\BINNT64;%WATCOM%\BINNT>> "%GITHUB_PATH%"
            set "PATH=%WATCOM%\BINNT64;%WATCOM%\BINNT;%PATH%"
            dir /s /b "%WATCOM%\*clib3r*" "%WATCOM%\BIN*\wcl*.exe" 2>nul
          ) else (
            echo Open Watcom binary directory not auto-detected
            exit /b 1
          )

      - name: 1. Build DOS / FreeDOS (bgc_freedos.exe)
        id: build_freedos
        continue-on-error: true
        run: |
          set "INCLUDE=%WATCOM%\H;%WATCOM%\H\NT"
          set "LIB=%WATCOM%\LIB386\DOS;%WATCOM%\LIB386;%WATCOM%\LIB386\NT"
          if exist "%WATCOM%\BINNT64\wcl386.exe" (
            "%WATCOM%\BINNT64\wcl386.exe" -bt=dos -l=dos4g bgc.c -fe=dist\bgc_freedos.exe -dBGC_VAULT_KEY=0x13572468u
          ) else if exist "%WATCOM%\BINNT\wcl386.exe" (
            "%WATCOM%\BINNT\wcl386.exe" -bt=dos -l=dos4g bgc.c -fe=dist\bgc_freedos.exe -dBGC_VAULT_KEY=0x13572468u
          ) else (
            wcl -bt=dos -mm -1 bgc.c -fe=dist\bgc_freedos.exe -dBGC_VAULT_KEY=0x13572468u
          )

      - name: 2. Build Win16 (bgc_win16.exe)
        id: build_win16
        continue-on-error: true
        run: |
          set "INCLUDE=%WATCOM%\H;%WATCOM%\H\WIN"
          set "LIB=%WATCOM%\LIB286\WIN;%WATCOM%\LIB286"
          if exist "%WATCOM%\BINNT\wcl.exe" (
            "%WATCOM%\BINNT\wcl.exe" -bt=windows -ml -1 bgc.c -fe=dist\bgc_win16.exe -dBGC_VAULT_KEY=0x13572468u
          ) else if exist "%WATCOM%\BINNT64\wcl.exe" (
            "%WATCOM%\BINNT64\wcl.exe" -bt=windows -ml -1 bgc.c -fe=dist\bgc_win16.exe -dBGC_VAULT_KEY=0x13572468u
          ) else (
            echo wcl.exe not found under WATCOM
            exit /b 1
          )

      - name: 3. Build Windows 9x (95 / 98 / ME)
        id: build_9x
        continue-on-error: true
        run: |
          for /f "tokens=*" %%I in ('"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath') do set "VSDIR=%%I"
          call "%VSDIR%\Common7\Tools\VsDevCmd.bat" -arch=x86 -host_arch=x64
          cl /nologo /O2 /FIwinsock2.h /DWINVER=0x0400 /D_WIN32_WINDOWS=0x0400 /DBGC_VAULT_KEY=0x13572468u bgc.c /Fe:dist\bgc_win95_98.exe /link gdi32.lib winmm.lib user32.lib ws2_32.lib && ^
          cl /nologo /O2 /FIwinsock2.h /DWINVER=0x0490 /D_WIN32_WINDOWS=0x0490 /DBGC_VAULT_KEY=0x13572468u bgc.c /Fe:dist\bgc_winme.exe /link gdi32.lib winmm.lib user32.lib ws2_32.lib

      - name: 4. Build NT up to 2000 (NT 4.0 -> Windows 2000)
        id: build_nt_2000
        continue-on-error: true
        run: |
          for /f "tokens=*" %%I in ('"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath') do set "VSDIR=%%I"
          call "%VSDIR%\Common7\Tools\VsDevCmd.bat" -arch=x86 -host_arch=x64
          cl /nologo /O2 /FIwinsock2.h /D_WIN32_WINNT=0x0400 /DBGC_VAULT_KEY=0x13572468u bgc.c /Fe:dist\bgc_nt40.exe /link gdi32.lib winmm.lib user32.lib ws2_32.lib && ^
          cl /nologo /O2 /FIwinsock2.h /D_WIN32_WINNT=0x0500 /DBGC_VAULT_KEY=0x13572468u bgc.c /Fe:dist\bgc_win2000.exe /link gdi32.lib winmm.lib user32.lib ws2_32.lib

      - name: 5. Build Windows XP 32-bit (XP32 - MSVC x86)
        id: build_xp32
        continue-on-error: true
        run: |
          for /f "tokens=*" %%I in ('"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath') do set "VSDIR=%%I"
          call "%VSDIR%\Common7\Tools\VsDevCmd.bat" -arch=x86 -host_arch=x64
          cl /nologo /O2 /FIwinsock2.h /D_WIN32_WINNT=0x0501 /DBGC_VAULT_KEY=0x13572468u bgc.c /Fe:dist\bgc_xp32.exe /link gdi32.lib winmm.lib user32.lib ws2_32.lib

      - name: Upload retro & XP32 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bgc-retro-nt-to-xp
          path: dist/*
          if-no-files-found: ignore

      - name: Check overall retro build status
        if: always()
        run: |
          set "ANY_FAIL=0"
          if not "%build_freedos_outcome%"=="success" set "ANY_FAIL=1"
          if not "%build_win16_outcome%"=="success" set "ANY_FAIL=1"
          if not "%build_9x_outcome%"=="success" set "ANY_FAIL=1"
          if not "%build_nt_2000_outcome%"=="success" set "ANY_FAIL=1"
          if not "%build_xp32_outcome%"=="success" set "ANY_FAIL=1"
          if "%ANY_FAIL%"=="1" (
            echo Some retro/XP32 targets failed; prior successful builds were uploaded to bgc-retro-nt-to-xp.
            exit /b 1
          )
